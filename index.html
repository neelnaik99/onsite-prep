<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Private notes</title>
<style>
:root { --bg:#f4f6f9; --surface:#fff; --ink:#16202b; --muted:#5a6777; --line:#dde2e9; --accent:#2552cc; --bad:#b3261e; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f141b; --surface:#171e27; --ink:#e5eaf0; --muted:#94a1b1; --line:#29323f; --accent:#86a5ff; --bad:#ff8a80; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 16px; }
form { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: grid; gap: 12px; }
h1 { font-size: 18px; margin: 0; }
p { margin: 0; color: var(--muted); font-size: 13px; }
input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
button { padding: 10px 12px; border: 0; border-radius: 6px; background: var(--accent); color: var(--surface); font: inherit; font-weight: 600; cursor: pointer; }
button[disabled] { opacity: .6; cursor: default; }
label.keep { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
#msg { color: var(--bad); min-height: 1.3em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<form id="lock" autocomplete="off">
  <h1>Private notes</h1>
  <p>Enter the passcode to open this page.</p>
  <input id="pass" type="password" aria-label="Passcode" placeholder="Passcode" autofocus required>
  <label class="keep"><input id="keep" type="checkbox"> Remember on this device</label>
  <button id="go" type="submit">Open</button>
  <p id="msg" role="alert"></p>
</form>
